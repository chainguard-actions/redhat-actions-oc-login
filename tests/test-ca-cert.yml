name: Test certificate authority data input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: "https://fake-openshift-server.example.com:6443"
          openshift_token: "fake-token-for-testing"
          certificate_authority_data: |
            -----BEGIN CERTIFICATE-----
            MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA0Z3VS5JJcds3xHn/ygWe
            fakeCAcertificatedatafortestingpurposesonly1234567890abcdefghijklmn
            -----END CERTIFICATE-----
          reveal_cluster_name: "false"
      - name: Assert action ran (connection failure is expected without a real cluster)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action failed as expected (no real cluster available)"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS"
