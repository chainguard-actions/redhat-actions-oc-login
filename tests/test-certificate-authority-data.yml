name: Test certificate_authority_data input fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://fake-openshift-server.example.com:6443'
          openshift_token: 'fake-token'
          certificate_authority_data: 'LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUJJakFOQmdrcWhraUc5dzBCQVFFRkFBT0NBUThBTUlJQkNnS0NBUUVBMAotLS0tLUVORCBDRVJUSUZJQ0FURS0tLS0t'
      - name: Assert action failed gracefully with connection error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to a fake server"
            exit 1
          fi
          echo "PASS: action failed as expected when using certificate_authority_data with unreachable server"
