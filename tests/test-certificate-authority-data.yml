name: Test certificate_authority_data input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://fake-openshift-server.example.com:6443'
          openshift_token: 'fake-token-for-testing'
          certificate_authority_data: |
            LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUJJakFOQmdrcWhraUc5dzBCQVFFRkFBT0NB
            UThBTUlJQkNnS0NBUUVBMFo1dnZpWFhBQUFBQUFBQUFBQUEKLS0tLS1FTkQgQ0VSVElGSUNBVEUt
            LS0tLQo=
          insecure_skip_tls_verify: 'false'
      - name: Assert action ran (fails gracefully with fake server and CA data)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake server"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
