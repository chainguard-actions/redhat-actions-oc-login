name: Test certificate_authority_data input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with certificate_authority_data input
        id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://fake-openshift-server.example.com:6443'
          openshift_token: 'fake-token'
          certificate_authority_data: |
            LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUJJakFOQmdrcWhraUc5dzBCQVFFRkFBT0NB
            UThBTUlJQkNnS0NBUUVBMFo1dnZlWFhIYjI5cGpRbzVWaQpUZXN0Q2VydGlmaWNhdGVEYXRhCi0t
            LS0tRU5EIENFUlRJRklDQVRFLS0tLS0K

      - name: Assert action attempted login with certificate_authority_data
        run: |
          # The action should have attempted to connect (and failed since server is fake)
          # We just verify the step ran (continue-on-error means we get here regardless)
          echo "Action ran with certificate_authority_data input - outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: certificate_authority_data input was accepted by the action"
