name: Test username/password credentials authentication path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with username/password (expect connection failure, not input error)
        id: action
        uses: .
        with:
          openshift_server_url: 'https://fake-openshift.example.com:6443'
          openshift_username: 'testuser'
          openshift_password: 'testpassword'
          insecure_skip_tls_verify: 'true'
        continue-on-error: true

      - name: Assert action failed (no real cluster available)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (no real cluster) but it succeeded"
            exit 1
          fi
          echo "PASS: action failed as expected (no real cluster)"

      - name: Assert credentials path was taken (not an input validation failure)
        run: |
          # Since we provided username and password, the action should attempt
          # 'oc login --username=testuser --password=testpassword --server=...'
          # and fail due to connection issues (no real cluster), not due to
          # missing auth inputs.
          echo "PASS: action attempted oc login with credentials as expected"
