name: Test credentials login with invalid server
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with username/password but invalid/unreachable server (expect failure)
        id: action
        uses: .
        with:
          openshift_server_url: 'https://invalid.example.openshift.com:6443'
          openshift_username: 'testuser'
          openshift_password: 'testpassword'
          insecure_skip_tls_verify: 'true'
          logout: 'false'
        continue-on-error: true

      - name: Assert action failed due to unreachable server
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to an invalid server with credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when attempting credentials login to an invalid server"
