name: Test incomplete credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with only username but no password (expect failure)
        id: action
        uses: .
        with:
          openshift_server_url: 'https://fake-cluster.example.com:6443'
          openshift_username: 'testuser'
          # openshift_password intentionally omitted
        continue-on-error: true

      - name: Assert action failed due to incomplete credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when only username is provided without password, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when credentials were incomplete (username without password)"
