name: Test missing auth inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no auth inputs (expect failure)
        id: action
        uses: .
        with:
          openshift_server_url: 'https://api.example.openshift.com:6443'
          # No token, no username/password, no OIDC
        continue-on-error: true

      - name: Assert action failed due to missing auth inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no auth inputs are provided, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no auth inputs were provided"
