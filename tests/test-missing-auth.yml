name: Test missing auth inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without auth inputs (expect failure)
        id: action
        uses: .
        with:
          openshift_server_url: 'https://fake-openshift.example.com:6443'
        continue-on-error: true

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail but it did not"
            exit 1
          fi
          echo "PASS: action failed as expected"

      - name: Assert failure was due to missing auth inputs
        run: |
          # The action should have set a failure message about missing auth inputs.
          # We verify the outcome was failure (already checked above).
          # The error message from auth.ts is:
          # "Failed to login: Required action inputs are missing. Either "openshift-token", or both..."
          # Since we can't directly read the failure message, we rely on the outcome check above.
          echo "PASS: missing auth inputs caused expected failure"
