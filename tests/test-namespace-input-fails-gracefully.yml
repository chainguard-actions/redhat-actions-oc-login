name: Test namespace input fails gracefully with invalid server
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://localhost:6443'
          openshift_token: 'invalid-token'
          insecure_skip_tls_verify: 'true'
          namespace: 'my-namespace'

      - name: Assert action failed (cannot connect to fake server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to invalid server with namespace, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid server URL with namespace input"
