name: Test namespace input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://invalid.example.com:6443'
          openshift_token: 'fake-token'
          namespace: 'my-test-namespace'
          insecure_skip_tls_verify: 'true'
          logout: 'false'
      - name: Assert action ran with namespace input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the server is unreachable, not because
          # namespace is an unrecognized input. Either failure or success is
          # acceptable here — what matters is the input was accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with namespace input (outcome: $OUTCOME)"
