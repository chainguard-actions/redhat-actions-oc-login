name: Test namespace input accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://fake-openshift-server.example.com:6443'
          openshift_token: 'fake-token-12345'
          namespace: 'my-namespace'
          insecure_skip_tls_verify: 'true'
      - name: Assert action failed with connection error (not input validation error)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because the server is unreachable,
          # not because the namespace input was rejected.
          # A failure here means the inputs were accepted and the action
          # attempted to connect (which is the expected behavior).
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to a non-existent server"
            exit 1
          fi
          echo "PASS: action accepted namespace input and correctly failed on unreachable server"
