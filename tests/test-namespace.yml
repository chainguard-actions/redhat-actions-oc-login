name: Test namespace input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with namespace input
        id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://fake-openshift-server.example.com:6443'
          openshift_token: 'fake-token'
          namespace: 'my-test-namespace'
          insecure_skip_tls_verify: 'true'

      - name: Assert action attempted login with namespace input
        run: |
          # The action should have attempted to connect (and failed since server is fake)
          # We just verify the step ran (continue-on-error means we get here regardless)
          echo "Action ran with namespace input - outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: namespace input was accepted by the action"
