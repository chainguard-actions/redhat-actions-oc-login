name: Test oidc_audience input
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://invalid.example.com:6443'
          use_oidc: 'true'
          oidc_audience: 'https://invalid.example.com:6443'
          insecure_skip_tls_verify: 'true'
          logout: 'false'
      - name: Assert action ran with oidc_audience input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the OIDC provider is not configured or
          # the server is unreachable, not because oidc_audience is an unrecognized
          # input. Either failure or success is acceptable — what matters is the
          # input was accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with oidc_audience input (outcome: $OUTCOME)"
