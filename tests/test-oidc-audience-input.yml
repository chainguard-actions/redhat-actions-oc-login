name: Test oidc_audience input
on:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://fake-openshift-server.example.com:6443'
          use_oidc: 'true'
          oidc_audience: 'https://fake-openshift-server.example.com:6443'
          insecure_skip_tls_verify: 'true'
      - name: Assert action ran with oidc_audience input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (OIDC not configured or server unreachable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
