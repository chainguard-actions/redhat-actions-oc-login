name: Test oidc_audience input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://unreachable.example.com:6443'
          use_oidc: 'true'
          oidc_audience: 'https://unreachable.example.com:6443'
          insecure_skip_tls_verify: 'true'
      - name: Assert action ran (expected to fail due to OIDC not available or unreachable server)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail (OIDC not available / server unreachable)"
            exit 1
          fi
          echo "PASS: action failed as expected"
