name: Test partial credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with only username (no password, no token) - expect failure
        id: action_username_only
        uses: .
        with:
          openshift_server_url: "https://fake-openshift-server:6443"
          openshift_username: "fake-user"
        continue-on-error: true

      - name: Assert action failed with only username provided
        run: |
          echo "outcome: ${{ steps.action_username_only.outcome }}"
          if [ "${{ steps.action_username_only.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when only username is provided without password or token"
            exit 1
          fi
          echo "PASS: action correctly failed when only username was provided"

      - name: Run action with only password (no username, no token) - expect failure
        id: action_password_only
        uses: .
        with:
          openshift_server_url: "https://fake-openshift-server:6443"
          openshift_password: "fake-password"
        continue-on-error: true

      - name: Assert action failed with only password provided
        run: |
          echo "outcome: ${{ steps.action_password_only.outcome }}"
          if [ "${{ steps.action_password_only.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when only password is provided without username or token"
            exit 1
          fi
          echo "PASS: action correctly failed when only password was provided"
