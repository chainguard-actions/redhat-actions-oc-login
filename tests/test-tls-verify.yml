name: Test TLS verification default behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default TLS verification (insecure_skip_tls_verify=false)
        id: action-tls
        uses: .
        with:
          openshift_server_url: 'https://fake-openshift.example.com:6443'
          openshift_token: 'fake-token-for-testing'
          insecure_skip_tls_verify: 'false'
        continue-on-error: true

      - name: Assert action failed (no real cluster, TLS verification enabled)
        run: |
          echo "outcome: ${{ steps.action-tls.outcome }}"
          if [ "${{ steps.action-tls.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (no real cluster) but it succeeded"
            exit 1
          fi
          echo "PASS: action failed as expected with TLS verification enabled"

      - name: Run action with insecure_skip_tls_verify=true
        id: action-notls
        uses: .
        with:
          openshift_server_url: 'https://fake-openshift.example.com:6443'
          openshift_token: 'fake-token-for-testing'
          insecure_skip_tls_verify: 'true'
        continue-on-error: true

      - name: Assert action failed (no real cluster, TLS verification skipped)
        run: |
          echo "outcome: ${{ steps.action-notls.outcome }}"
          if [ "${{ steps.action-notls.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (no real cluster) but it succeeded"
            exit 1
          fi
          echo "PASS: action failed as expected with TLS verification skipped"
