name: Test token auth fails gracefully with invalid server
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install oc CLI
        run: |
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz | tar xz -C /usr/local/bin oc kubectl || true
          # Fallback: try apt or skip if unavailable
          which oc || (echo "oc not found, installing via alternative..." && \
            curl -sL https://github.com/openshift/oc/releases/download/v4.13.0/oc.tar.gz | tar xz -C /usr/local/bin || true)

      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://localhost:6443'
          openshift_token: 'invalid-token'
          insecure_skip_tls_verify: 'true'

      - name: Assert action failed (cannot connect to fake server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to invalid server, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid server URL"
