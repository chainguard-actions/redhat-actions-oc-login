name: Test token login with unreachable server
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with token but unreachable server (expect failure at connection)
        id: action
        uses: .
        with:
          openshift_server_url: 'https://unreachable-cluster.example.invalid:6443'
          openshift_token: 'fake-token-for-testing'
          insecure_skip_tls_verify: 'true'
        continue-on-error: true

      - name: Assert action failed at connection (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when server is unreachable, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when server is unreachable (inputs were accepted)"
