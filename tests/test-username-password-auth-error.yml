name: Test username/password auth connection error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          openshift_server_url: 'https://fake-openshift-server.example.com:6443'
          openshift_username: 'fakeuser'
          openshift_password: 'fakepassword'
          insecure_skip_tls_verify: 'true'
      - name: Assert action failed (cannot connect to fake server with username/password)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to a non-existent server"
            exit 1
          fi
          echo "PASS: action correctly failed when server is unreachable"
