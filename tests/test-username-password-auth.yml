name: Test username/password authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with username/password auth (expect failure at oc login, not at input validation)
        id: action
        uses: .
        with:
          openshift_server_url: "https://fake-openshift-server:6443"
          openshift_username: "fake-user"
          openshift_password: "fake-password"
          insecure_skip_tls_verify: "true"
        continue-on-error: true

      - name: Assert action failed at oc login (not at input validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail because oc is not installed or the server is unreachable,
          # NOT because of missing credentials (which would be a different error).
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when connecting to a fake server"
            exit 1
          fi
          echo "PASS: action correctly failed when connecting to a fake server with username/password auth"
